# Platform-neutral Tier-1 figure environment (Linux / macOS / Windows-WSL).
# The packages explicitly requested when building the env, pinned to the
# versions in the exact macOS capture (duckfig.yml); conda resolves the
# platform-specific builds and dependencies.
name: duckfig
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - numpy=2.4.3
  - pandas=3.0.2
  - matplotlib=3.10.9
  - pillow=12.2.0
  - svgwrite=1.4.3
  - cairosvg=2.9.0
  - r-base=4.4
  - r-tidyverse=2.0.0
  - r-scales=1.4.0
  - r-ggrepel=0.9.8
  - r-cowplot=1.2.0
  - r-patchwork=1.3.2
  - r-ggh4x=0.3.1
  - r-ggbeeswarm=0.7.3
  - r-ggforce=0.5.0
  - r-data.table=1.17.8
  - r-ragg=1.5.2
  - bioconductor-deseq2=1.46.0
  # figS03 / figS17 mixed models (versions = the R library those fits ran in)
  - r-lme4=2.0_6
  - r-glmmtmb=1.1.14
  - r-emmeans=2.0.4
  - r-digest=0.6.39
  # figS03 motif scans (Bioconductor 3.20, as on the cluster R 4.4 library)
  - bioconductor-biostrings=2.74.0      # cluster had 2.74.1; conda has 2.74.0 for R 4.4
  - bioconductor-genomicranges=1.58.0
  - bioconductor-motifmatchr=1.28.0
  - bioconductor-tfbstools=1.44.0
  - bioconductor-universalmotif=1.24.0  # cluster had 1.24.2; conda has 1.24.0 for R 4.4
  - bioconductor-jaspar2020=0.99.10
  - bioconductor-bsgenome=1.74.0
  - bioconductor-bsgenomeforge=1.6.0   # builds the custom duck BSgenome (README; pipeline/archr_build_bsgenome.R)
  - pip
  - pip:
      - adjusttext==1.4.0
      - logomaker==0.8.7
      - pdf2image==1.17.0
      - pypdf==6.10.2
      - scipy==1.17.1
      - statsmodels==0.14.6
      - upsetplot==0.9.0
